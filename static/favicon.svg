<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="verifyfirst">
  <rect width="64" height="64" rx="10" fill="#141319"/>
  <!-- The ring is the measurement; the gap is what it cannot see. Drawn as an
       absence rather than marked with a symbol, so the shape carries the idea. -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#79cdf5" stroke-width="6"
          stroke-linecap="butt" stroke-dasharray="80 27" transform="rotate(-58 32 32)"/>
  <path d="M43 20 L52 11" stroke="#e4835b" stroke-width="4" stroke-linecap="round"/>
</svg>
